[package]
name = "dark-light"
version = "3.0.0"
authors = [
    "Corey Farwell <coreyf@rwell.org>",
    "Eduardo Flores <edflores@proton.me>",
]
edition = "2021"
license = "MIT/Apache-2.0"
repository = "https://github.com/rust-dark-light/rust-dark-light"
description = "Detect if dark mode or light mode is enabled"
readme = "README.md"
build = "build.rs"
rust-version = "1.78.0"

[features]
default = ["async-io"]
tokio = ["zbus/tokio", "dep:futures-core", "dep:futures-channel"]
async-io = ["zbus/async-io", "dep:futures-core", "dep:futures-channel"]

[dependencies]
futures-core = { version = "0.3", optional = true }
futures-channel = { version = "0.3", optional = true }

[dev-dependencies]
futures-util = "0.3"
futures-executor = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
zbus = "5.19.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSObject",
    "NSString",
    "NSDictionary",
    "NSUserDefaults",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["MediaQueryList", "Window", "EventTarget", "Event"] }
